version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: taskmarket-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: taskmarket
      POSTGRES_PASSWORD: taskmarket
      POSTGRES_DB: taskmarket
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
