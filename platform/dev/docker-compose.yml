version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: clawtasker-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: clawtasker
      POSTGRES_PASSWORD: clawtasker
      POSTGRES_DB: clawtasker
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
