version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stakework-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: stakework
      POSTGRES_PASSWORD: stakework
      POSTGRES_DB: stakework
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
