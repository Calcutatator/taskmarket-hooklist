name: Roll back Discord app on Railway

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Railway environment to restore
        required: true
        type: choice
        options: [DEVNET, PRODUCTION]
      ref:
        description: Immutable 40-character known-good commit SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-discord-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Verify immutable known-good deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLBACK_REF: ${{ inputs.ref }}
        run: |
          if ! [[ "$ROLLBACK_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Rollback ref must be a full immutable commit SHA."
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$ROLLBACK_REF" origin/main; then
            echo "Rollback commit is not reachable from origin/main."
            exit 1
          fi

          if [ "${{ inputs.environment }}" = "PRODUCTION" ]; then
            WORKFLOW_NAME="Deploy Discord app to Railway PRODUCTION"
            WORKFLOW_EVENT="push"
          else
            WORKFLOW_NAME="Deploy Discord app to Railway DEVNET"
            WORKFLOW_EVENT="workflow_run"
          fi
          CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${ROLLBACK_REF}" \
            --jq "[.workflow_runs[] | select(.name == \"${WORKFLOW_NAME}\" and .event == \"${WORKFLOW_EVENT}\")] | .[0].conclusion // \"not_found\"")
          if [ "$CONCLUSION" != "success" ]; then
            echo "No successful prior ${WORKFLOW_NAME} run exists for this commit."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.26.1

      - name: Stamp and deploy known-good Discord app
        env:
          RAILWAY_TOKEN: ${{ inputs.environment == 'PRODUCTION' && secrets.RAILWAY_TOKEN || secrets.RAILWAY_TOKEN_TESTNET }}
        run: |
          DEPLOY_SHA="$(git rev-parse HEAD)"
          railway variable set \
            "COMMIT_SHA=${DEPLOY_SHA}" \
            --service "${{ secrets.RAILWAY_DISCORD_SERVICE_NAME }}" \
            --environment "${{ inputs.environment }}" \
            --skip-deploys
          railway up \
            --service "${{ secrets.RAILWAY_DISCORD_SERVICE_NAME }}" \
            --environment "${{ inputs.environment }}"

      - name: Verify rollback
        env:
          DISCORD_APP_URL: ${{ inputs.environment == 'PRODUCTION' && secrets.DISCORD_APP_PRODUCTION_URL || secrets.DISCORD_APP_DEVNET_URL }}
          EXPECTED_DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: EXPECTED_COMMIT_SHA="$(git rev-parse HEAD)" make discord smoke

      - name: Install command registration tooling
        run: make install

      - name: Exercise signed interaction seam after recovery
        run: make discord signed-smoke

      - name: Reconcile commands from the known-good ref
        if: inputs.environment == 'DEVNET'
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_APP_URL: ${{ inputs.environment == 'PRODUCTION' && secrets.DISCORD_APP_PRODUCTION_URL || secrets.DISCORD_APP_DEVNET_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: make discord register

      - name: Reconcile production canary commands from the known-good ref
        if: inputs.environment == 'PRODUCTION'
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_APP_URL: ${{ secrets.DISCORD_APP_PRODUCTION_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: make discord register

      - name: Reconcile global production commands from the known-good ref
        if: inputs.environment == 'PRODUCTION'
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_APP_URL: ${{ secrets.DISCORD_APP_PRODUCTION_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: make discord register
