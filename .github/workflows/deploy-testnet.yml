name: Deploy to Railway Testnet

# Implements: ADR-0002 (merge to main auto-deploys app code to shared testnet)
#
# Runs after CI's own "CI" workflow completes on main, not on the same push event CI itself
# runs on -- ci.yml's quality job takes many minutes, so checking "did CI pass on this commit"
# on the push event directly would race it and find "in_progress", not "success".
# workflow_run instead only fires once CI has genuinely finished.
#
# No separate testnet branch: main is both the PR target and this workflow's trigger. This is
# the first, always-automatic stage of promotion -- validate on the shared testnet chain here,
# then `make release` promotes the same commit to production once you're happy with it.
#
# App code only (backend/frontend/docs) against the persistent testnet chain/diamond. Unlike
# deploy-preview.yml, this never touches contracts or spins up an Anvil -- a testnet contract
# upgrade is `make upgrade testnet`, run manually by a developer, entirely separate from this
# workflow.
#
# RAILWAY_TOKEN_TESTNET, not RAILWAY_TOKEN: Railway's own project tokens are scoped to a single
# environment, not the whole project -- the existing RAILWAY_TOKEN secret was issued for the
# production environment specifically and can't see this one at all ("Environment not found"),
# confirmed live on this workflow's first real run.
#
# The Railway environments were renamed to DEVNET and PRODUCTION; this workflow targets DEVNET.
# The environment name is not a label -- railway up fails outright when it does not resolve.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-testnet-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend to Railway testnet
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_TESTNET }}
        run: |
          railway variable set \
            "RAILPACK_BUILD_CMD=make build backend" \
            --service "${{ secrets.RAILWAY_BACKEND_SERVICE_NAME }}" \
            --environment DEVNET \
            --skip-deploys
          railway up \
            --service "${{ secrets.RAILWAY_BACKEND_SERVICE_NAME }}" \
            --environment DEVNET \
            --detach

      - name: Deploy web to Railway testnet
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_TESTNET }}
        run: |
          railway variable set \
            "RAILPACK_BUILD_CMD=make build web" \
            --service "${{ secrets.RAILWAY_FRONTEND_SERVICE_NAME }}" \
            --environment DEVNET \
            --skip-deploys
          railway up \
            --service "${{ secrets.RAILWAY_FRONTEND_SERVICE_NAME }}" \
            --environment DEVNET \
            --detach

      - name: Deploy docs to Railway testnet
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_TESTNET }}
        run: |
          railway up \
            --service "${{ secrets.RAILWAY_DOCS_SERVICE_NAME }}" \
            --environment DEVNET \
            --detach

      # DEVNET must include the dedicated game catalog. The service secret is a release
      # prerequisite; a missing value fails rather than reporting a partial deployment.
      - name: Deploy Slap-Chop Games to Railway testnet
        id: slap_chop
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_TESTNET }}
          RAILWAY_SERVICE_NAME: ${{ secrets.RAILWAY_SLAP_CHOP_GAMES_DEVNET_SERVICE_NAME }}
        run: |
          [ -n "$RAILWAY_SERVICE_NAME" ] || { echo "RAILWAY_SLAP_CHOP_GAMES_DEVNET_SERVICE_NAME is required for a Slap-Chop DEVNET release." >&2; exit 1; }

          resolve_domain() {
            local service="$1" out=""
            for i in $(seq 1 5); do
              RAW=$(railway domain --service "$service" --environment DEVNET --json 2>&1)
              out=$(echo "$RAW" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('domain') or (d.get('domains') or [''])[0])" 2>/dev/null)
              if [ -n "$out" ]; then
                echo "${out#https://}"
                return 0
              fi
              echo "railway domain ($service) returned: $RAW" >&2
              sleep 3
            done
            return 1
          }

          BACKEND_DOMAIN=$(resolve_domain "${{ secrets.RAILWAY_BACKEND_SERVICE_NAME }}") || { echo "Could not resolve the DEVNET backend domain" >&2; exit 1; }

          for kv in \
            "COMMIT_SHA=bootstrap-${{ github.event.workflow_run.head_sha }}" \
            "DEPLOY_ENVIRONMENT=devnet" \
            "RAILPACK_BUILD_CMD=make build slap-chop-games" \
            "RAILPACK_START_CMD=pnpm --filter @taskmarket/slap-chop-games start" \
            "SLAP_CHOP_DATA_MODE=live-readonly" \
            "SLAP_CHOP_LIVE_SOURCE_API_URL=https://api.taskmarket.dev" \
            "TASKMARKET_API_URL=https://$BACKEND_DOMAIN" \
            "NEXT_PUBLIC_API_URL=https://$BACKEND_DOMAIN"; do
            railway variable set "$kv" \
              --service "$RAILWAY_SERVICE_NAME" \
              --environment DEVNET \
              --skip-deploys
          done

          railway up \
            --service "$RAILWAY_SERVICE_NAME" \
            --environment DEVNET

          SLAP_CHOP_DOMAIN=$(resolve_domain "$RAILWAY_SERVICE_NAME") || { echo "Could not resolve the Slap-Chop Games DEVNET domain after bootstrap deployment" >&2; exit 1; }
          for kv in \
            "COMMIT_SHA=${{ github.event.workflow_run.head_sha }}" \
            "NEXT_PUBLIC_SITE_URL=https://$SLAP_CHOP_DOMAIN"; do
            railway variable set "$kv" \
              --service "$RAILWAY_SERVICE_NAME" \
              --environment DEVNET \
              --skip-deploys
          done
          railway up \
            --service "$RAILWAY_SERVICE_NAME" \
            --environment DEVNET \
            --detach
          echo "url=https://$SLAP_CHOP_DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Verify Slap-Chop Games testnet serves this commit
        env:
          EXPECTED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_DEPLOY_ENVIRONMENT: devnet
          SLAP_CHOP_HEALTH_URL: ${{ steps.slap_chop.outputs.url }}
        run: make slap-chop-health

      - name: Report deployment
        run: echo "Deployed ${{ github.event.workflow_run.head_sha }} to Railway testnet (backend + web + docs + Slap-Chop Games)"
