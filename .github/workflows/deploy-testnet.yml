name: Deploy to Railway Testnet

# Automatic on every push to the testnet branch -- app code only (backend/frontend/docs)
# against the persistent testnet chain/diamond. Unlike deploy-preview.yml, this never touches
# contracts or spins up an Anvil -- a testnet contract upgrade is `make upgrade testnet`,
# run manually by a developer, entirely separate from this workflow.

on:
  push:
    branches:
      - testnet

concurrency:
  group: deploy-testnet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Verify CI passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse HEAD)
          STATUS=$(gh api "repos/${{ github.repository }}/commits/${SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "quality")] | .[0].conclusion // "not_found"')
          echo "CI status for ${SHA}: ${STATUS}"
          if [ "$STATUS" != "success" ]; then
            echo "CI did not pass on this commit (status: ${STATUS}). Aborting deploy."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend to Railway testnet
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service "${{ secrets.RAILWAY_BACKEND_SERVICE_NAME }}" \
            --environment testnet \
            --detach

      - name: Deploy web to Railway testnet
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service "${{ secrets.RAILWAY_FRONTEND_SERVICE_NAME }}" \
            --environment testnet \
            --detach

      - name: Deploy docs to Railway testnet
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service "${{ secrets.RAILWAY_DOCS_SERVICE_NAME }}" \
            --environment testnet \
            --detach

      - name: Report deployment
        run: echo "Deployed ${{ github.sha }} to Railway testnet (backend + web + docs)"
