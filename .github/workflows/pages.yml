name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Check source
        run: npm run check
      - name: Test registry
        run: npm test
      - name: Refresh registry snapshot
        run: npm run registry:build
      - name: Validate deployable registry
        run: npm run registry:validate
      - name: Build static Pages artifact
        run: npm run pages:build
      - name: Validate static Pages artifact
        run: npm run pages:validate
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
