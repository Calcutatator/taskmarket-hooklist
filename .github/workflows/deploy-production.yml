name: Deploy to Railway Production

on:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Verify CI passed on tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse HEAD)
          # Checks the "CI" workflow's own overall conclusion -- a rollup of every job it
          # contains -- rather than a specific job by name. Previously only checked the
          # "quality" check-run, so a tagged release could ship even if ui or
          # skill-conformance had failed on that commit. This way stays correct automatically
          # as ci.yml's job list changes, with nothing here to keep in sync. Can't gate this
          # the same way deploy-testnet.yml does (workflow_run on ci.yml completing) since
          # that trigger is inherently automatic -- production must stay tag-gated and manual
          # (ADR-0001).
          CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | .[0].conclusion // "not_found"')
          echo "CI workflow conclusion for ${SHA}: ${CONCLUSION}"
          if [ "$CONCLUSION" != "success" ]; then
            echo "CI did not pass on this commit (status: ${CONCLUSION}). Aborting deploy."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # `--detach` is deliberately absent here, unlike before: it returns as soon as Railway
      # accepts the upload, so this job went green whether the build then succeeded, failed, or
      # never started. A "Failed to snapshot repository" on Railway's side left the previous
      # version serving with a green tick over it. Without `--detach` the step waits for the
      # build and fails when it fails.
      #
      # COMMIT_SHA is stamped first (with --skip-deploys, so it does not trigger its own deploy)
      # so the running process can prove which build it is. Same pattern the Discord production
      # workflow already uses.
      - name: Stamp and deploy backend to Railway production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variable set \
            "COMMIT_SHA=${{ github.sha }}" \
            --service "${{ secrets.RAILWAY_BACKEND_SERVICE_NAME }}" \
            --environment PRODUCTION \
            --skip-deploys
          railway variable set \
            "RAILPACK_BUILD_CMD=make build backend" \
            --service "${{ secrets.RAILWAY_BACKEND_SERVICE_NAME }}" \
            --environment PRODUCTION \
            --skip-deploys
          railway up \
            --service "${{ secrets.RAILWAY_BACKEND_SERVICE_NAME }}" \
            --environment PRODUCTION

      - name: Deploy web to Railway production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variable set \
            "RAILPACK_BUILD_CMD=make build web" \
            --service "${{ secrets.RAILWAY_FRONTEND_SERVICE_NAME }}" \
            --environment PRODUCTION \
            --skip-deploys
          railway up \
            --service "${{ secrets.RAILWAY_FRONTEND_SERVICE_NAME }}" \
            --environment PRODUCTION

      - name: Deploy docs to Railway production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service "${{ secrets.RAILWAY_DOCS_SERVICE_NAME }}" \
            --environment PRODUCTION

      # The dedicated service and games.taskmarket.dev are production release prerequisites.
      - name: Stamp and deploy Slap-Chop Games to Railway production
        id: slap_chop
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_NAME: ${{ secrets.RAILWAY_SLAP_CHOP_GAMES_SERVICE_NAME }}
        run: |
          [ -n "$RAILWAY_SERVICE_NAME" ] || { echo "RAILWAY_SLAP_CHOP_GAMES_SERVICE_NAME is required for a Slap-Chop production release." >&2; exit 1; }

          for kv in \
            "COMMIT_SHA=${{ github.sha }}" \
            "DEPLOY_ENVIRONMENT=production" \
            "RAILPACK_BUILD_CMD=make build slap-chop-games" \
            "RAILPACK_START_CMD=pnpm --filter @taskmarket/slap-chop-games start" \
            "TASKMARKET_API_URL=https://api.taskmarket.dev" \
            "NEXT_PUBLIC_API_URL=https://api.taskmarket.dev" \
            "NEXT_PUBLIC_SITE_URL=https://games.taskmarket.dev"; do
            railway variable set "$kv" \
              --service "$RAILWAY_SERVICE_NAME" \
              --environment PRODUCTION \
              --skip-deploys
          done

          railway up \
            --service "$RAILWAY_SERVICE_NAME" \
            --environment PRODUCTION

      - name: Verify Slap-Chop Games production serves this commit
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          EXPECTED_DEPLOY_ENVIRONMENT: production
          SLAP_CHOP_HEALTH_URL: https://games.taskmarket.dev
        run: make slap-chop-health

      # The deploy steps above prove the build succeeded. This proves the *running* process is
      # the one that was just built -- a successful build that never became the live version is
      # indistinguishable from a good deploy by a health check alone, because the old version
      # answers `ok` perfectly happily.
      - name: Verify production is serving this commit
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 40); do
            SERVING=$(curl -sf --max-time 20 https://api.taskmarket.dev/api/health \
              | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{process.stdout.write(JSON.parse(d).commitSha??"")}catch{process.stdout.write("")}})' || true)
            if [ "$SERVING" = "$EXPECTED_COMMIT_SHA" ]; then
              echo "Production is serving $EXPECTED_COMMIT_SHA"
              exit 0
            fi
            echo "waiting for production to report $EXPECTED_COMMIT_SHA (currently: ${SERVING:-unreachable})"
            sleep 15
          done
          echo "Production never reported $EXPECTED_COMMIT_SHA -- the build may have succeeded without becoming live" >&2
          exit 1

      - name: Report deployment
        run: echo "Deployed ${{ github.ref_name }} to Railway production (backend + web + docs + Slap-Chop Games)"
