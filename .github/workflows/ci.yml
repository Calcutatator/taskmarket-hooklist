name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here is capped at 45 minutes, uniformly and deliberately.
#
# The caps used to be tuned per job (2 to 45), which meant the number was a guess about how long
# work should take rather than a backstop against work that has stopped. `ui-e2e` was set to 20
# and got cancelled at exactly 20 -- not failing an assertion, just running long -- which failed
# the `ui` gate, cancelled the whole run, and skipped the testnet deploy that gates on it. A
# release then could not go out until someone noticed and re-ran it. That had already happened
# once before on another PR.
#
# A timeout is a safety net, not a budget: a job that finishes in two minutes still finishes in
# two minutes, and raising the ceiling costs nothing until something actually hangs. The trade is
# that a genuinely stuck job now burns up to 45 minutes of runner time instead of 2 -- which is
# the right way round, because a stuck job is rare and a slow-but-fine job is not.
#
# Keep them uniform. A per-job number invites re-tuning after every slow run, which is the loop
# this is meant to end.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the tree this run actually touches, so unaffected jobs can skip instead
  # of redoing full-repo work that Turborepo has no remote cache to shortcut in CI (no
  # TURBO_TOKEN/TURBO_TEAM configured, so every runner starts cold).
  #
  # `quality-contracts` is the most expensive job by a distance -- around 19 minutes, nearly
  # all of it compiling Solidity twice. Package-level jobs (storybook, slap-chop-games,
  # web-build/ui-e2e, backend-tests, js-tests-web) are the next tier: single-app, Playwright- or
  # Postgres-backed, genuinely isolated by package boundary. quality-js and js-tests-other are
  # broader -- each runs turbo across every workspace package except a few named exclusions
  # (see the Makefile), not one single package -- so they skip only when *nothing outside their
  # own exclusion set* is affected, and still thread Turborepo's `--filter=...[ref]` selection
  # through on top of that so a run that IS relevant still does less internal work.
  #
  # Turborepo is the source of truth for "did a package or anything it depends on change" --
  # it already reads the real pnpm workspace graph, so a packages/shared edit correctly marks
  # every package that depends on it as affected too, without hand-maintained path lists that
  # drift out of sync as the workspace grows. `packages/contracts` is Foundry/Solidity, outside
  # that graph entirely, so it still needs its own direct path check.
  changes:
    runs-on: blacksmith-32vcpu-ubuntu-2204
    timeout-minutes: 45
    outputs:
      base_sha: ${{ steps.filter.outputs.base_sha }}
      contracts: ${{ steps.filter.outputs.contracts }}
      web: ${{ steps.filter.outputs.web }}
      backend: ${{ steps.filter.outputs.backend }}
      slap_chop: ${{ steps.filter.outputs.slap_chop }}
      quality_js: ${{ steps.filter.outputs.quality_js }}
      other: ${{ steps.filter.outputs.other }}
      skill: ${{ steps.filter.outputs.skill }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # Needed only so `pnpm turbo ... --dry=json` below can resolve the workspace graph.
      # This adds a fixed ~30-60s to every run's critical path in exchange for skipping (or
      # narrowing) everything downstream that turns out to be unaffected -- a clear net win
      # once quality-contracts alone is 19 minutes.
      - run: make install

      - id: filter
        run: |
          # A pull request is compared against its merge base; a push to main against its parent.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch -q origin "${{ github.base_ref }}"
            MERGE_BASE="$(git merge-base "$BASE" HEAD)"
          else
            MERGE_BASE="HEAD^"
          fi
          BASE_SHA="$(git rev-parse "$MERGE_BASE")"
          RANGE="$MERGE_BASE...HEAD"
          echo "range: $RANGE"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

          # `build` is defined for every package and turbo.json sets no task-specific `inputs`,
          # so this uses turbo's default (every file in the package) as the affected signal --
          # not because build itself matters here, just as a graph-walk probe.
          #
          # pnpm/turbo can print a variable number of preamble lines before the JSON (an engine
          # warning, an update-available banner, or nothing at all, depending on environment) --
          # `sed -n '/^{/,$p'` finds the actual start of the object regardless of how many there
          # are, rather than assuming a fixed line count and risking stripping the JSON itself.
          pnpm turbo build --filter="...[$BASE_SHA]" --dry=json 2>/dev/null \
            | sed -n '/^{/,$p' > /tmp/turbo-affected.json || echo '{"packages":[]}' > /tmp/turbo-affected.json
          AFFECTED="$(node -e "console.log(JSON.stringify(require('/tmp/turbo-affected.json').packages || []))")"
          echo "affected packages: $AFFECTED"

          affected() { echo "$AFFECTED" | grep -q "\"$1\""; }

          CONTRACTS=false
          if git diff --name-only "$RANGE" | grep -Eq '^(packages/contracts/|scripts/run-ci-test\.mjs$)'; then
            CONTRACTS=true
            git diff --name-only "$RANGE" | grep -E '^(packages/contracts/|scripts/run-ci-test\.mjs$)' | head -5
          fi

          WEB=false
          affected "@taskmarket/web" && WEB=true
          BACKEND=false
          affected "@taskmarket/backend" && BACKEND=true
          SLAP_CHOP=false
          affected "@taskmarket/slap-chop-games" && SLAP_CHOP=true
          DOCS=false
          affected "@taskmarket/docs" && DOCS=true

          # quality-js and js-tests(other) each run turbo across a *set* of packages (every
          # workspace package except a few named exclusions -- see the Makefile), not one single
          # package, so there's no single package name to check with `affected` above. Instead,
          # ask whether anything in the affected list falls outside that job's own exclusion set
          # -- mirroring the exact --filter='!@taskmarket/X' exclusions each job's own turbo
          # invocation already uses, so this can't drift out of sync with what actually runs.
          #
          # Turbo also reports its own root pseudo-package ("//") as affected whenever a diff
          # touches a file that isn't owned by any workspace package (e.g. docs/rfc/*.md at repo
          # root). "//" isn't a real target either job's --filter can match, so it must be
          # excluded here too or a docs-only change would wrongly mark both jobs relevant.
          any_affected_outside() {
            node -e '
              const affected = JSON.parse(process.argv[1]);
              const excluded = new Set(process.argv.slice(2));
              process.exit(affected.some((p) => !excluded.has(p)) ? 0 : 1);
            ' "$AFFECTED" "$@"
          }
          QUALITY_JS=false
          any_affected_outside "@taskmarket/contracts" "@taskmarket/docs" "@taskmarket/web" "//" && QUALITY_JS=true
          OTHER=false
          any_affected_outside "@taskmarket/contracts" "@taskmarket/docs" "@taskmarket/backend" "@taskmarket/web" "//" && OTHER=true

          # Makefile and ci.yml are large, multi-target/multi-job files shared across this
          # whole workflow -- diffing the whole file would re-trigger every job on any
          # unrelated edit elsewhere in either. Extract just each job/target's own block from
          # each side and compare those instead. Covers the case turbo's package graph can't:
          # someone editing the job/target definition itself, not the package it drives.
          extract_block() {
            # $1=ref $2=path $3=block-start pattern $4=sibling-boundary pattern
            git show "$1:$2" 2>/dev/null | awk -v start="$3" -v sib="$4" '
              $0 ~ start { p=1 }
              p && $0 ~ sib && $0 !~ start { exit }
              p { print }
            '
          }
          block_changed() {
            ! diff -q \
              <(extract_block "$MERGE_BASE" "$1" "$2" "$3") \
              <(extract_block "HEAD" "$1" "$2" "$3") \
              >/dev/null
          }
          MAKEFILE_HEADER_CHANGED=false
          block_changed "Makefile" '^SHELL :=' '^[a-zA-Z0-9_.-]+:' && MAKEFILE_HEADER_CHANGED=true

          if [ "$CONTRACTS" = "false" ] && { [ "$MAKEFILE_HEADER_CHANGED" = "true" ] \
              || block_changed "Makefile" '^contract:' '^[a-zA-Z0-9_.-]+:' \
              || block_changed ".github/workflows/ci.yml" '^  quality-contracts:' '^  [a-zA-Z_-]+:$'; }; then
            CONTRACTS=true
            echo "contracts-relevant block changed in Makefile or ci.yml"
          fi
          if [ "$WEB" = "false" ] && { [ "$MAKEFILE_HEADER_CHANGED" = "true" ] \
              || block_changed ".github/workflows/ci.yml" '^  storybook:' '^  [a-zA-Z_-]+:$' \
              || block_changed ".github/workflows/ci.yml" '^  web-build:' '^  [a-zA-Z_-]+:$' \
              || block_changed ".github/workflows/ci.yml" '^  ui-e2e:' '^  [a-zA-Z_-]+:$'; }; then
            WEB=true
            echo "web-relevant block changed in Makefile or ci.yml"
          fi
          if [ "$BACKEND" = "false" ] && { [ "$MAKEFILE_HEADER_CHANGED" = "true" ] \
              || block_changed ".github/workflows/ci.yml" '^  backend-tests:' '^  [a-zA-Z_-]+:$'; }; then
            BACKEND=true
            echo "backend-relevant block changed in Makefile or ci.yml"
          fi
          if [ "$SLAP_CHOP" = "false" ] && { [ "$MAKEFILE_HEADER_CHANGED" = "true" ] \
              || block_changed "Makefile" '^slap-chop:' '^[a-zA-Z0-9_.-]+:' \
              || block_changed ".github/workflows/ci.yml" '^  slap-chop-games:' '^  [a-zA-Z_-]+:$'; }; then
            SLAP_CHOP=true
            echo "slap-chop-relevant block changed in Makefile or ci.yml"
          fi
          if [ "$QUALITY_JS" = "false" ] && { [ "$MAKEFILE_HEADER_CHANGED" = "true" ] \
              || block_changed "Makefile" '^ci-quality-js:' '^[a-zA-Z0-9_.-]+:' \
              || block_changed ".github/workflows/ci.yml" '^  quality-js:' '^  [a-zA-Z_-]+:$'; }; then
            QUALITY_JS=true
            echo "quality-js-relevant block changed in Makefile or ci.yml"
          fi
          # ci-test: is one Makefile target shared by backend-tests, js-tests-web, and
          # js-tests-other (a case statement keyed on CI_TEST_TARGET) -- a change anywhere in it
          # could affect any of the three, and there's no cheap way to tell which case branch
          # changed without parsing the case statement itself, so treat it as relevant to all
          # three alike. Conservative, not precise, but still narrower than the old "any Makefile
          # edit reruns everything" behaviour.
          CI_TEST_CHANGED=false
          block_changed "Makefile" '^ci-test:' '^[a-zA-Z0-9_.-]+:' && CI_TEST_CHANGED=true
          if [ "$BACKEND" = "false" ] && [ "$CI_TEST_CHANGED" = "true" ]; then
            BACKEND=true
            echo "ci-test: target changed in Makefile"
          fi
          if [ "$WEB" = "false" ] && [ "$CI_TEST_CHANGED" = "true" ]; then
            WEB=true
            echo "ci-test: target changed in Makefile"
          fi
          if [ "$OTHER" = "false" ] && { [ "$MAKEFILE_HEADER_CHANGED" = "true" ] \
              || [ "$CI_TEST_CHANGED" = "true" ] \
              || block_changed ".github/workflows/ci.yml" '^  js-tests-other:' '^  [a-zA-Z_-]+:$'; }; then
            OTHER=true
            echo "js-tests-other-relevant block changed in Makefile or ci.yml"
          fi
          if [ "$WEB" = "false" ] && block_changed ".github/workflows/ci.yml" '^  js-tests-web:' '^  [a-zA-Z_-]+:$'; then
            WEB=true
            echo "js-tests-web block changed in ci.yml"
          fi
          if [ "$DOCS" = "false" ] && { [ "$MAKEFILE_HEADER_CHANGED" = "true" ] \
              || block_changed "Makefile" '^docs-og-check:' '^[a-zA-Z0-9_.-]+:'; }; then
            DOCS=true
            echo "docs-relevant block changed in Makefile"
          fi

          # skill-conformance covers skill tests across backend+cli(other)+web, plus a docs-og
          # check -- not one single package, so it's authorised by any of the outputs those
          # already answer, rather than a new independent path check that could disagree with
          # them. One combined output because verify-ci-gate.mjs's condition parser only
          # understands a single `needs.changes.outputs.X == 'true'` shape, not a compound one --
          # see its own comment on CONDITION.
          SKILL=false
          if [ "$WEB" = "true" ] || [ "$BACKEND" = "true" ] || [ "$OTHER" = "true" ] || [ "$DOCS" = "true" ]; then
            SKILL=true
          fi
          if [ "$SKILL" = "false" ] && { [ "$MAKEFILE_HEADER_CHANGED" = "true" ] \
              || block_changed "Makefile" '^skill-conformance:' '^[a-zA-Z0-9_.-]+:' \
              || block_changed ".github/workflows/ci.yml" '^  skill-conformance:' '^  [a-zA-Z_-]+:$'; }; then
            SKILL=true
            echo "skill-conformance-relevant block changed in Makefile or ci.yml"
          fi

          echo "contracts=$CONTRACTS" >> "$GITHUB_OUTPUT"
          echo "web=$WEB" >> "$GITHUB_OUTPUT"
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "slap_chop=$SLAP_CHOP" >> "$GITHUB_OUTPUT"
          echo "quality_js=$QUALITY_JS" >> "$GITHUB_OUTPUT"
          echo "other=$OTHER" >> "$GITHUB_OUTPUT"
          echo "skill=$SKILL" >> "$GITHUB_OUTPUT"

  skill-conformance:
    needs: changes
    if: needs.changes.outputs.skill == 'true'
    runs-on: blacksmith-32vcpu-ubuntu-2204
    # The docs build installs Playwright OS and browser dependencies. A slow Ubuntu
    # mirror can consume most of the previous 10-minute budget before Vocs starts.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: make install

      - run: make skill-conformance

      - run: make docs-og-check

  adr:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Full history so lint-check adr can diff against the PR base branch
          # for its changed-without-an-ADR coverage warning.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: make install

      - run: make lint-check adr
        env:
          # On PRs, diff against the base branch so the warn-only "source changed
          # without an ADR change" coverage check actually receives the file list.
          # Empty on push events -- integrity checks only.
          ADR_LINT_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}

      - run: make lint-check specs

      - name: ADR embodiment audit
        if: always()
        run: pnpm --filter @taskmarket/adr run adr-audit -- --fail-on-drift

      - name: Governance/application-source scope check
        if: always()
        run: pnpm --filter @taskmarket/adr run scope-check
        env:
          # This check is inherently about a PR's cumulative diff against its base branch, not a
          # single commit -- unlike ADR_LINT_BASE above, there's no useful pre-commit equivalent
          # (it would repeat the same warning on every commit in a long-lived branch). Empty on
          # push events -- nothing to compare against without a PR base.
          SCOPE_CHECK_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}

      - name: Citation-existence check
        if: always()
        run: pnpm --filter @taskmarket/adr run citation-check
        env:
          # gh CLI auth for the issue/PR-number half of the check (the file-path half needs
          # nothing). The job's own `pull-requests: write` permission is sufficient scope for
          # read-only issue/PR lookups by number.
          GH_TOKEN: ${{ github.token }}

      - name: Comment on PR with drift summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const postComment = require(`${process.env.GITHUB_WORKSPACE}/packages/adr/pr-comment.cjs`);
            await postComment({ github, context, workspace: process.env.GITHUB_WORKSPACE });

  quality-js:
    needs: changes
    if: needs.changes.outputs.quality_js == 'true'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Needs the merge-base commit reachable so CI_BASE_REF below can resolve -- this job
          # spans too much of the workspace to skip outright, but turbo's own affected-package
          # filter still narrows what it actually does.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: make install

      # This is deliberately separate from tests. Test shards have a measured five-minute
      # budget; lint, format, type checking, and builds are independent quality gates.
      - name: Run non-test JavaScript checks
        timeout-minutes: 5
        run: make ci-quality-js CI_BASE_REF='${{ needs.changes.outputs.base_sha }}'

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: backend
            shard: 1/2
            label: backend-1-of-2
          - target: backend
            shard: 2/2
            label: backend-2-of-2

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:15-alpine
        env:
          POSTGRES_USER: taskmarket
          POSTGRES_PASSWORD: taskmarket
          POSTGRES_DB: taskmarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: make install

      # The Make target measures the child process and terminates it at 300 seconds. This outer
      # timeout only leaves one minute for that process to report and clean up after termination.
      - name: Test ${{ matrix.label }}
        timeout-minutes: 6
        run: >-
          make ci-test
          CI_TEST_TARGET='${{ matrix.target }}'
          CI_TEST_SHARD='${{ matrix.shard }}'
        env:
          DATABASE_URL: postgresql://taskmarket:taskmarket@localhost:5432/taskmarket_test

  # Split from a single js-tests job (which used to bundle these target: web/other matrix legs
  # together) because a job-level `if:` can't gate one matrix leg differently from another --
  # web and other are gated on different changes outputs, so they need to be different jobs.
  js-tests-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: blacksmith-32vcpu-ubuntu-2204
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/2
            label: web-1-of-2
          - shard: 2/2
            label: web-2-of-2

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: make install

      - name: Test ${{ matrix.label }}
        timeout-minutes: 6
        run: >-
          make ci-test
          CI_TEST_TARGET='web'
          CI_TEST_SHARD='${{ matrix.shard }}'

  # See js-tests-web above for why this is a separate job. Turbo's own --filter='...[ref]' still
  # narrows what it does inside a relevant run; `other` here only decides whether to run at all.
  js-tests-other:
    needs: changes
    if: needs.changes.outputs.other == 'true'
    runs-on: blacksmith-32vcpu-ubuntu-2204
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Needed so CI_BASE_REF below can resolve for turbo's affected-package filter.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: make install

      - name: Test other-js
        timeout-minutes: 6
        run: >-
          make ci-test
          CI_TEST_TARGET='other'
          CI_BASE_REF='${{ needs.changes.outputs.base_sha }}'

  web-build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: blacksmith-32vcpu-ubuntu-2204
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: make install

      # The production app used to be built independently in both browser jobs and quality-js.
      # Build it once, gate the build itself, then fan the same bytes out to every E2E shard.
      - name: Build production web app
        timeout-minutes: 5
        run: make ui-ci-build

      - name: Upload production web app
        uses: actions/upload-artifact@v7
        with:
          name: web-production-build
          path: |
            apps/web/.next
            !apps/web/.next/cache
          include-hidden-files: true
          retention-days: 1

  quality-contracts:
    needs: changes
    # Skipped when no Solidity changed. The job verifies the contracts and nothing else, so on a
    # run that touches none of them it re-proves what the previous run already proved.
    if: needs.changes.outputs.contracts == 'true'
    runs-on: blacksmith-32vcpu-ubuntu-2204
    # Raised from 30, which this job outgrew. Nearly all of it is compilation: the ABI freshness
    # check is a full `forge build` at ~12-13 minutes, and coverage recompiles separately under
    # `--ir-minimum` for another ~4. Everything else -- lint, format, the contract suite, the gas
    # snapshot, Slither -- totals under two minutes because it reuses the first build's artifacts.
    # rev020's extra facet pushed the total past 30, and coverage, running last, was the step the
    # cap cut off. Measured on this runner, not a developer machine: it is a 2-core/7GB box,
    # because the repo is private.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install Python (for Slither)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Slither
        # Pinned for deterministic results — bump in lockstep with the local Homebrew/pip version.
        run: pip install slither-analyzer==0.11.5

      - run: make install

      # Foundry compiles from cold on every run otherwise, and that is the bulk of this job:
      # the ABI freshness check below is a full `forge build` measured at 13.5 minutes, after
      # which every other contract step finishes in seconds off the same artifacts. This job
      # gates every PR, including ones that touch no Solidity at all.
      #
      # Restoring the cache is safe rather than merely fast. Foundry keys artifacts by a hash of
      # each source file and its settings, so anything that does not match is rebuilt -- a stale
      # entry costs a recompile, never a wrong artifact. The two gates that would care, ABI
      # freshness and the gas snapshot, regenerate and diff, so a bad cache surfaces as a failure
      # and not as a false pass.
      #
      # `restore-keys` is the part that earns its keep: on a partial hit a PR touching one facet
      # rebuilds that facet instead of all 126 files. Artifacts are small -- 21MB of `out/` and
      # under a megabyte of `cache/`.
      - name: Cache Foundry build artifacts
        uses: actions/cache@v6
        with:
          path: |
            packages/contracts/out
            packages/contracts/cache
            ~/.svm
          key: forge-${{ runner.os }}-${{ hashFiles('packages/contracts/src/**', 'packages/contracts/test/**', 'packages/contracts/script/**', 'packages/contracts/foundry.toml', 'packages/contracts/remappings.txt') }}
          restore-keys: |
            forge-${{ runner.os }}-

      # The committed ABI under packages/contracts/abi/ is what the backend indexer
      # reads its event definitions from, so a stale copy would silently defeat the
      # indexer's drift guard. Same shape as the gas snapshot check below.
      #
      # This also builds the contracts, so there is deliberately no separate
      # `make build contracts` step above it -- that would compile and regenerate
      # exactly what this regenerates a moment later.
      - name: ABI freshness check
        run: make contract abi-check

      - run: make lint-check contracts

      - run: make format-check contracts

      - name: Contract test shard
        timeout-minutes: 6
        run: make contract test-ci

      - name: Gas snapshot check
        timeout-minutes: 6
        run: make contract snapshot-check-ci

      # TaskTokenRewardHook sits behind a proxy, so a sequential state variable would be
      # repointed by any later insertion above it. Its state lives in a fixed-slot struct
      # instead; this fails if one ever leaks back out into sequential storage.
      - name: Storage layout check
        run: make contract storage-check

      - name: Slither static analysis
        run: make contract audit

      # Restored after removing it broke this branch. The evidence is three runs: without swap
      # the coverage step is killed mid-compile (exit 143, post-steps skipped) at 28 minutes
      # against a 45-minute cap, so it is not the timeout; with swap the same commit passed
      # 11/11.
      #
      # main does not need this and rev020 does, which is the part worth understanding: main's
      # contract changes are cached, so its ABI build compiles 66 files and coverage 124. This
      # branch changes contracts, so the cache key differs, the ABI build compiles ~126 and takes
      # 1044s, and coverage compiles 126. Same 2-core/7GB runner, materially more work.
      #
      # Added ALONGSIDE the runner's own /swapfile -- `swapon` takes several areas, and an
      # earlier version that ran `swapoff -a` first took the machine down mid-job. Non-fatal, so
      # a refused allocation lets the coverage step fail on its own terms rather than being
      # skipped by this one.
      - name: Add swap for the coverage compile
        run: |
          sudo fallocate -l 8G /mnt/swap-coverage || sudo dd if=/dev/zero of=/mnt/swap-coverage bs=1M count=8192
          sudo chmod 600 /mnt/swap-coverage
          sudo mkswap /mnt/swap-coverage
          sudo swapon /mnt/swap-coverage
          swapon --show
          free -h
        continue-on-error: true

      # Coverage is an analysis phase, not one of the five-minute correctness-test shards. Forge
      # recompiles every contract with instrumentation and executes the suite as one indivisible
      # command; its cold compiler path alone exceeds five minutes. Keep measuring it as its own
      # step until Foundry can separate instrumented compilation from coverage execution.
      - name: Coverage analysis
        run: make contract coverage-check

      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slither-report
          path: packages/contracts/reports/slither-audit.md
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: packages/contracts/reports/coverage/lcov.info
          retention-days: 30

  storybook:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    # Browsers and OS-level Playwright deps ship pre-baked in this image, so there is no
    # apt-get step here for a slow package mirror to stall on multi-hundred-MB browser
    # downloads -- the make install below still needs one tiny package (see Install make).
    # Pin by digest so the image can't drift without a workflow diff; re-resolve with
    # `docker buildx imagetools inspect mcr.microsoft.com/playwright:v1.60.0-noble` when
    # bumping @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      # --ipc=host: the default 64MB /dev/shm is too small for Chromium's shared-memory renderer
      # IPC. Chromium's own sandbox is disabled via launchOptions in playwright.config.ts instead
      # of granting SYS_ADMIN here -- narrower than a broad capability grant, safe because these
      # tests only ever load this app's own pages, never untrusted content.
      options: --ipc=host

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # The image doesn't ship make, which every other step in this job goes through.
      - name: Install make
        # `apt-get update` fetches mirror indexes, and a mirror that accepts the connection and
        # then stops responding produces no output and no error -- the step simply stops, and
        # the job's 45-minute timeout is what eventually ends it. Observed twice on consecutive
        # runs before this job moved into the Playwright image: 43 and 44 minutes spent in the
        # browser-install step, each ended by the job timeout, with the test step after it
        # never running. The browser download is gone now, but the index fetch that actually
        # stalled is still here, so the exposure is unchanged.
        #
        # Two bounds, because they catch different things. The Acquire options make apt itself
        # give up on a stalled connection and retry another mirror, which is the failure that
        # was actually seen. timeout-minutes is the backstop for anything they don't cover:
        # generous against a slow-but-working mirror (the observed healthy fetch was still
        # going 41s in), and far below the 45 minutes this currently costs.
        timeout-minutes: 5
        run: |
          apt-get -o Acquire::Retries=3 \
                  -o Acquire::http::Timeout=20 \
                  -o Acquire::https::Timeout=20 update
          apt-get install -y --no-install-recommends make

      # actions/checkout marks the workspace safe for its own git process, but that doesn't
      # carry over to later steps' git invocations (make install's git submodule update) in
      # this container -- they still see it as dubious ownership without this.
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: make install

      - run: make storybook-ci
        env:
          CI: true

      - name: Upload Storybook
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: apps/web/storybook-static
          retention-days: 14

  # Slap-Chop Games has a deliberately separate component catalogue and production artifact.
  # Keep its checks isolated from the existing marketplace UI so a foundation regression is
  # directly attributable and the app remains independently deployable.
  slap-chop-games:
    needs: changes
    if: needs.changes.outputs.slap_chop == 'true'
    runs-on: blacksmith-32vcpu-ubuntu-2204
    timeout-minutes: 45
    # See storybook above for why this runs in Playwright's own image rather than
    # `playwright install --with-deps` on ubuntu-latest, and why --ipc=host is set and the
    # sandbox is disabled via launchOptions instead of granting SYS_ADMIN.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --ipc=host

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # See storybook above: the image doesn't ship make.
      - name: Install make
        # `apt-get update` fetches mirror indexes, and a mirror that accepts the connection and
        # then stops responding produces no output and no error -- the step simply stops, and
        # the job's 45-minute timeout is what eventually ends it. Observed twice on consecutive
        # runs before this job moved into the Playwright image: 43 and 44 minutes spent in the
        # browser-install step, each ended by the job timeout, with the test step after it
        # never running. The browser download is gone now, but the index fetch that actually
        # stalled is still here, so the exposure is unchanged.
        #
        # Two bounds, because they catch different things. The Acquire options make apt itself
        # give up on a stalled connection and retry another mirror, which is the failure that
        # was actually seen. timeout-minutes is the backstop for anything they don't cover:
        # generous against a slow-but-working mirror (the observed healthy fetch was still
        # going 41s in), and far below the 45 minutes this currently costs.
        timeout-minutes: 5
        run: |
          apt-get -o Acquire::Retries=3 \
                  -o Acquire::http::Timeout=20 \
                  -o Acquire::https::Timeout=20 update
          apt-get install -y --no-install-recommends make

      # See storybook above: checkout's safe.directory doesn't carry over to later steps.
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: make install

      - name: Run isolated Slap-Chop Games checks
        run: |
          make lint-check slap-chop-games
          make format-check slap-chop-games
          make type-check slap-chop-games
          make test slap-chop-games
          make build slap-chop-games

      - run: make storybook-ci slap-chop-games
        env:
          CI: true

      - run: make e2e slap-chop-games
        env:
          CI: true

      - name: Upload Slap-Chop Games Storybook
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slap-chop-games-storybook-static
          path: apps/slap-chop-games/storybook-static
          retention-days: 14

      - name: Upload Slap-Chop Games Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slap-chop-games-playwright-report
          path: apps/slap-chop-games/playwright-report
          retention-days: 14

      - name: Upload Slap-Chop Games Playwright results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slap-chop-games-playwright-test-results
          path: apps/slap-chop-games/test-results
          retention-days: 14

  quality:
    if: always()
    needs:
      [
        quality-js,
        backend-tests,
        js-tests-web,
        js-tests-other,
        web-build,
        changes,
        quality-contracts,
        skill-conformance,
        adr,
        storybook,
        slap-chop-games,
      ]
    runs-on: blacksmith-32vcpu-ubuntu-2204
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Verify quality shards
        run: node scripts/verify-ci-gate.mjs --gate quality
        env:
          NEEDS: ${{ toJSON(needs) }}

  ui-e2e:
    needs: [web-build, changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    # See storybook above for why this runs in Playwright's own image rather than
    # `playwright install --with-deps` on ubuntu-latest, and why --ipc=host is set and the
    # sandbox is disabled via launchOptions instead of granting SYS_ADMIN.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project: chromium-*
            shard: 1/3
            label: chromium-1-of-3
          - browser: webkit
            project: webkit-*
            shard: 1/4
            label: webkit-1-of-4
          - browser: chromium
            project: chromium-*
            shard: 2/3
            label: chromium-2-of-3
          - browser: webkit
            project: webkit-*
            shard: 2/4
            label: webkit-2-of-4
          - browser: chromium
            project: chromium-*
            shard: 3/3
            label: chromium-3-of-3
          - browser: webkit
            project: webkit-*
            shard: 3/4
            label: webkit-3-of-4
          - browser: webkit
            project: webkit-*
            shard: 4/4
            label: webkit-4-of-4

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # See storybook above: the image doesn't ship make.
      - name: Install make
        # `apt-get update` fetches mirror indexes, and a mirror that accepts the connection and
        # then stops responding produces no output and no error -- the step simply stops, and
        # the job's 45-minute timeout is what eventually ends it. Observed twice on consecutive
        # runs before this job moved into the Playwright image: 43 and 44 minutes spent in the
        # browser-install step, each ended by the job timeout, with the test step after it
        # never running. The browser download is gone now, but the index fetch that actually
        # stalled is still here, so the exposure is unchanged.
        #
        # Two bounds, because they catch different things. The Acquire options make apt itself
        # give up on a stalled connection and retry another mirror, which is the failure that
        # was actually seen. timeout-minutes is the backstop for anything they don't cover:
        # generous against a slow-but-working mirror (the observed healthy fetch was still
        # going 41s in), and far below the 45 minutes this currently costs.
        timeout-minutes: 5
        run: |
          apt-get -o Acquire::Retries=3 \
                  -o Acquire::http::Timeout=20 \
                  -o Acquire::https::Timeout=20 update
          apt-get install -y --no-install-recommends make

      # See storybook above: checkout's safe.directory doesn't carry over to later steps.
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: make install

      - name: Download production web app
        uses: actions/download-artifact@v8
        with:
          name: web-production-build
          path: apps/web/.next

      - name: Test ${{ matrix.label }}
        timeout-minutes: 6
        run: >-
          make ui-ci-e2e
          UI_CI_SKIP_BUILD=1
          UI_CI_PROJECT='${{ matrix.project }}'
          UI_CI_SHARD='${{ matrix.shard }}'
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.label }}
          path: apps/web/playwright-report
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.label }}
          path: apps/web/test-results
          retention-days: 14

  ui:
    if: always()
    needs:
      [
        quality-js,
        backend-tests,
        js-tests-web,
        js-tests-other,
        web-build,
        changes,
        storybook,
        slap-chop-games,
        ui-e2e,
      ]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Verify UI shards
        run: node scripts/verify-ci-gate.mjs --gate ui
        env:
          NEEDS: ${{ toJSON(needs) }}
