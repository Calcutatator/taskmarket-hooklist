name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-conformance:
    runs-on: ubuntu-latest
    # The docs build installs Playwright OS and browser dependencies. A slow Ubuntu
    # mirror can consume most of the previous 10-minute budget before Vocs starts.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: make install

      - run: make skill-conformance

      - run: make docs-og-check

  adr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Full history so lint-check adr can diff against the PR base branch
          # for its changed-without-an-ADR coverage warning.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: make install

      - run: make lint-check adr
        env:
          # On PRs, diff against the base branch so the warn-only "source changed
          # without an ADR change" coverage check actually receives the file list.
          # Empty on push events -- integrity checks only.
          ADR_LINT_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}

      - run: make lint-check specs

      - name: ADR embodiment audit
        if: always()
        run: pnpm --filter @taskmarket/adr run adr-audit -- --fail-on-drift

      - name: Governance/application-source scope check
        if: always()
        run: pnpm --filter @taskmarket/adr run scope-check
        env:
          # This check is inherently about a PR's cumulative diff against its base branch, not a
          # single commit -- unlike ADR_LINT_BASE above, there's no useful pre-commit equivalent
          # (it would repeat the same warning on every commit in a long-lived branch). Empty on
          # push events -- nothing to compare against without a PR base.
          SCOPE_CHECK_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}

      - name: Citation-existence check
        if: always()
        run: pnpm --filter @taskmarket/adr run citation-check
        env:
          # gh CLI auth for the issue/PR-number half of the check (the file-path half needs
          # nothing). The job's own `pull-requests: write` permission is sufficient scope for
          # read-only issue/PR lookups by number.
          GH_TOKEN: ${{ github.token }}

      - name: Comment on PR with drift summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const postComment = require(`${process.env.GITHUB_WORKSPACE}/packages/adr/pr-comment.cjs`);
            await postComment({ github, context, workspace: process.env.GITHUB_WORKSPACE });

  quality-js:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:15-alpine
        env:
          POSTGRES_USER: taskmarket
          POSTGRES_PASSWORD: taskmarket
          POSTGRES_DB: taskmarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: make install

      - run: make ci-quality-js
        env:
          DATABASE_URL: postgresql://taskmarket:taskmarket@localhost:5432/taskmarket_test

  quality-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install Python (for Slither)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Slither
        # Pinned for deterministic results — bump in lockstep with the local Homebrew/pip version.
        run: pip install slither-analyzer==0.11.5

      - run: make install

      # Foundry compiles from cold on every run otherwise, and that is the bulk of this job:
      # the ABI freshness check below is a full `forge build` measured at 13.5 minutes, after
      # which every other contract step finishes in seconds off the same artifacts. This job
      # gates every PR, including ones that touch no Solidity at all.
      #
      # Restoring the cache is safe rather than merely fast. Foundry keys artifacts by a hash of
      # each source file and its settings, so anything that does not match is rebuilt -- a stale
      # entry costs a recompile, never a wrong artifact. The two gates that would care, ABI
      # freshness and the gas snapshot, regenerate and diff, so a bad cache surfaces as a failure
      # and not as a false pass.
      #
      # `out-coverage` is cached alongside `out` and kept separate from it on purpose. Coverage
      # compiles under `--ir-minimum`, and while it shared `out/` it overwrote the default-profile
      # artifacts the ABI check and gas snapshot need -- so the cache saved coverage's build and
      # the next run recompiled 66 of 126 files at 750s. Two directories, two profiles, both warm.
      #
      # `restore-keys` is the part that earns its keep: on a partial hit a PR touching one facet
      # rebuilds that facet instead of all 126 files. Artifacts are small -- 21MB of `out/` and
      # under a megabyte of `cache/`.
      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            packages/contracts/out
            packages/contracts/out-coverage
            packages/contracts/cache
            ~/.svm
          key: forge-${{ runner.os }}-${{ hashFiles('packages/contracts/src/**', 'packages/contracts/test/**', 'packages/contracts/script/**', 'packages/contracts/foundry.toml', 'packages/contracts/remappings.txt') }}
          restore-keys: |
            forge-${{ runner.os }}-

      # The committed ABI under packages/contracts/abi/ is what the backend indexer
      # reads its event definitions from, so a stale copy would silently defeat the
      # indexer's drift guard. Same shape as the gas snapshot check below.
      #
      # This also builds the contracts, so there is deliberately no separate
      # `make build contracts` step above it -- that would compile and regenerate
      # exactly what this regenerates a moment later.
      - name: ABI freshness check
        run: make contract abi-check

      - run: make lint-check contracts

      - run: make format-check contracts

      - run: make contract test

      - name: Gas snapshot check
        run: make contract snapshot-check

      - name: Slither static analysis
        run: make contract audit

      - name: Coverage check
        run: make contract coverage-check

      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: packages/contracts/reports/slither-audit.md
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: packages/contracts/reports/coverage/lcov.info
          retention-days: 30

  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: make install

      - run: make storybook-install-browsers

      - run: make storybook-ci
        env:
          CI: true

      - name: Upload Storybook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: apps/web/storybook-static
          retention-days: 14

  quality:
    if: always()
    needs: [quality-js, quality-contracts, skill-conformance, adr, storybook]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify quality shards
        run: |
          test "${{ needs.quality-js.result }}" = "success"
          test "${{ needs.quality-contracts.result }}" = "success"
          test "${{ needs.skill-conformance.result }}" = "success"
          test "${{ needs.adr.result }}" = "success"
          test "${{ needs.storybook.result }}" = "success"

  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project: chromium-*
          - browser: webkit
            project: webkit-*

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: make install

      - run: make ui-ci-install-browsers UI_CI_BROWSER=${{ matrix.browser }}

      - run: make ui-ci-e2e UI_CI_PROJECT='${{ matrix.project }}'
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.browser }}
          path: apps/web/test-results
          retention-days: 14

  ui:
    if: always()
    needs: [quality-js, storybook, ui-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify UI shards
        run: |
          test "${{ needs.quality-js.result }}" = "success"
          test "${{ needs.storybook.result }}" = "success"
          test "${{ needs.ui-e2e.result }}" = "success"
