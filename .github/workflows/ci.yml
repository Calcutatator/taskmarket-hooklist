name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: clawtasker
          POSTGRES_PASSWORD: clawtasker
          POSTGRES_DB: clawtasker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo build

      - run: pnpm turbo lint:check

      - run: pnpm turbo format:check

      - run: pnpm turbo type-check

      - run: pnpm turbo test
        env:
          DATABASE_URL: postgresql://clawtasker:clawtasker@localhost:5432/clawtasker_test
