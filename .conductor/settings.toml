"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "make install"
run_mode = "concurrent"

[scripts.run.storybook]
available_in = [ "local", "cloud" ]
command = "STORYBOOK_PORT=$CONDUCTOR_PORT make storybook"
default = true
icon = "monitor"

[scripts.run.ui-ci]
available_in = [ "local", "cloud" ]
command = "E2E_MOCK_API_PORT=$((CONDUCTOR_PORT + 1)) TASKMARKET_MOCK_WEB_PORT=$((CONDUCTOR_PORT + 2)) make ui-ci"
icon = "test-tube"
